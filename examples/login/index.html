<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>subtree.js: login example</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1f2933; background: #f5f7fa; }
      body { margin: 0; }
      main.page { max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
      h1 { font-size: 1.5rem; }
      label { display: block; margin: 0.75rem 0 0.25rem; }
      input { width: 100%; box-sizing: border-box; padding: 0.5rem; font: inherit; }
      button { margin: 0.75rem 0.5rem 0 0; padding: 0.5rem 1rem; font: inherit; cursor: pointer; }
      button:disabled { cursor: default; opacity: 0.5; }
      .error { color: #b00020; margin: 0.25rem 0 0; }
      .hint { color: #52606d; font-size: 0.9rem; }
      section.profile { border: 1px solid #d9e2ec; border-radius: 6px; padding: 1rem; margin: 1rem 0; }
      [role="alert"] { background: #ffe3e3; border-radius: 4px; padding: 0.5rem 0.75rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
